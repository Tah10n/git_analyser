name: Feature request
description: Suggest an improvement to repository exploration.
title: 'feat: '
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the use case and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed improvement
      description: Describe the behavior you would like and alternatives you have considered.
    validations:
      required: true
